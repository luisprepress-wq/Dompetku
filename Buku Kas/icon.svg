<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Coin Behind -->
  <circle cx="200" cy="170" r="60" fill="url(#coinGrad)" filter="url(#shadow)" />
  <circle cx="200" cy="170" r="46" fill="none" stroke="#D97706" stroke-width="4" stroke-dasharray="6 4" />
  <text x="200" y="185" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#B45309" text-anchor="middle">Rp</text>
  
  <!-- Wallet Body -->
  <g filter="url(#shadow)">
    <rect x="96" y="180" width="320" height="230" rx="36" fill="#FFFFFF" />
    <!-- Wallet Flap / Top Divider -->
    <path d="M 96 230 L 416 230" stroke="#E2E8F0" stroke-width="4" />
    <!-- Inner Card Preview -->
    <rect x="136" y="150" width="160" height="60" rx="12" fill="#3B82F6" opacity="0.9" />
    <!-- Wallet Clasp -->
    <path d="M 330 250 L 416 250 A 30 30 0 0 1 416 330 L 330 330 Z" fill="#EEF2FF" stroke="#CBD5E1" stroke-width="2" />
    <!-- Clasp Button -->
    <circle cx="390" cy="290" r="14" fill="#F59E0B" stroke="#D97706" stroke-width="3" />
    <!-- Text / Logo on Wallet -->
    <text x="140" y="320" font-family="Arial, sans-serif" font-weight="800" font-size="28" fill="#1E293B">BUKU KAS</text>
    <text x="140" y="350" font-family="Arial, sans-serif" font-weight="600" font-size="16" fill="#64748B">Kelas 1 Makkah</text>
  </g>
</svg>